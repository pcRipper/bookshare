# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2  on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/app/public;

    # Docker's embedded DNS, for every variable upstream below. Hoisted to the
    # server so the fastcgi and proxy blocks share one definition — a literal
    # upstream name is resolved once at config load and then pinned for the life
    # of the process, which is precisely the failure mode these avoid.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Match PHP's post_max_size / upload_max_filesize (docker/local/php/php.ini)
    # so a large CSV import reaches Symfony instead of dying as a 413 here.
    client_max_body_size 50m;

    # Mercure hub (real-time SSE). Proxied to the Go hub on the internal network;
    # buffering and gzip MUST be off or the event stream gets held back / corrupted.
    # Resolved at request time (variable upstream) so a down/restarted hub only
    # 502s SSE instead of failing nginx startup or pinning a stale container IP.
    location /.well-known/mercure {
        set $mercure_upstream mercure;
        # $request_uri (full original URI incl. ?topic=…) is required with a
        # variable upstream — without it nginx may forward only the path and drop
        # the topic query string, leaving the SSE stream subscribed to nothing.
        proxy_pass http://$mercure_upstream$request_uri;
        proxy_read_timeout 24h;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        gzip off;
    }

    # Unauthenticated share pages. Must precede `location /api/` — nginx picks
    # the longest matching prefix, so this wins for /api/public/* only.
    location /api/public/ {
        limit_req   zone=public_api burst=100 nodelay;
        limit_conn  public_conn 50;
        limit_req_status 429;
        limit_conn_status 429;

        try_files $uri /index.php$is_args$args;
    }

    # API → Symfony front controller
    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    # The SPA entry point is the one file under /build/ whose *path* is stable
    # while its contents change every release — it must never be cached, or a
    # returning browser keeps requesting last release's hashed bundles. Must
    # precede `location /build/`, hence the exact match.
    location = /build/index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Vite-built static assets (JS/CSS/images)
    # brotli_static/gzip_static are enabled globally (nginx.conf): nginx serves
    # the precompressed .br/.gz emitted by `vite build` when the client supports
    # it, falling back to the raw file otherwise.
    location /build/ {
        try_files $uri =404;
        # One header, not `expires 1y` plus an add_header — those emit two
        # separate Cache-Control lines.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Server-side cached avatars (and any other localized uploads). Filenames are
    # content-hashed, so the bytes at a given path never change → cache hard.
    location /uploads/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA — all other routes serve the Vue entry point
    location / {
        try_files $uri /build/index.html;
    }

    # PHP-FPM — only index.php is the entry point
    #
    # Variable upstream, same reason as Mercure's: a literal `phpfpm:9000` is
    # resolved once at startup and pinned, so recreating the phpfpm container
    # onto a different IP 502s everything until nginx is restarted by hand.
    location ~ ^/index\.php(/|$) {
        set $fpm_upstream phpfpm:9000;
        fastcgi_pass $fpm_upstream;
        # nginx defaults to 60s, which is fine for every request the app serves
        # except one: POST /api/admin/dumps forks pg_dump or walks every table,
        # and on a database of any size that outruns a minute — the response
        # would 504 while the dump kept running, leaving an operator staring at
        # an error beside a file that did in fact appear. Raised only here, and
        # the exposure is bounded by the admin gate plus the 5/hour limiter:
        # nothing an ordinary member can reach can hold a worker this long.
        fastcgi_read_timeout 300s;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        include fastcgi_params;
        internal;
    }

    # FPM status for Alloy metrics
    location = /fpm-status {
        set $fpm_status_upstream phpfpm:9000;
        fastcgi_pass $fpm_status_upstream;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
    }

    # Nginx stub_status for Alloy metrics
    location = /nginx_status {
        stub_status on;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
