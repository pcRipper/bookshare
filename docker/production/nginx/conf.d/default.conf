# ── HTTP :80 — ACME challenge + redirect to HTTPS ───────────────────────────
server {
    listen 80;
    server_name _;

    # Let's Encrypt http-01 webroot challenge (served from the shared volume
    # that the host certbot writes to). Must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — the app ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name _;

    # Fixed cert paths. init-certs.sh writes a self-signed pair here on first
    # boot; the certbot --deploy-hook overwrites them with the real cert and
    # reloads nginx (see DEPLOY.md).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/app/public;

    # Docker's embedded DNS, for every variable upstream below. Hoisted to the
    # server so the fastcgi and proxy blocks share one definition — a literal
    # upstream name is resolved once at config load and then pinned for the life
    # of the process, which is precisely the failure mode these avoid.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # PHP's post_max_size / upload_max_filesize are 50M (docker/production/php/
    # php.ini); without this nginx's 1m default silently overrides them and a
    # large CSV import dies as a 413 HTML page the import modal can't parse.
    client_max_body_size 50m;

    # Mercure hub (real-time SSE). Proxied to the Go hub on the internal network;
    # buffering and gzip MUST be off or the event stream gets held back / corrupted.
    # Resolved at request time (variable upstream) so a down/restarted hub only
    # 502s SSE instead of failing nginx startup or pinning a stale container IP.
    location /.well-known/mercure {
        set $mercure_upstream mercure;
        # $request_uri (full original URI incl. ?topic=…) is required with a
        # variable upstream — without it nginx may forward only the path and drop
        # the topic query string, leaving the SSE stream subscribed to nothing.
        proxy_pass http://$mercure_upstream$request_uri;
        proxy_read_timeout 24h;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        gzip off;
    }

    # Unauthenticated share pages. Must precede `location /api/` — nginx picks
    # the longest matching prefix, so this wins for /api/public/* only.
    location /api/public/ {
        limit_req   zone=public_api burst=20 nodelay;
        limit_conn  public_conn 10;
        limit_req_status 429;
        limit_conn_status 429;

        try_files $uri /index.php$is_args$args;
    }

    # API → Symfony front controller
    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    # The SPA entry point is the one file under /build/ whose *path* is stable
    # while its contents change every release — it must never be cached, or a
    # returning browser keeps requesting last release's hashed bundles. Must
    # precede `location /build/`, hence the exact match.
    #
    # Every location that sets its own add_header must also repeat the HSTS one:
    # add_header does not inherit into a block that declares any of its own, so
    # the server-level policy above silently vanishes from these responses.
    location = /build/index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Vite-built static assets (JS/CSS/images). brotli_static/gzip_static
    # (nginx.conf) serve the precompressed .br/.gz when the client supports it.
    location /build/ {
        try_files $uri =404;
        # One header, not `expires 1y` plus an add_header — those emit two
        # separate Cache-Control lines and leave the max-age and the immutable
        # hint for an intermediary to reconcile.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Server-side cached avatars (and any other localized uploads). Filenames are
    # content-hashed, so the bytes at a given path never change → cache hard.
    location /uploads/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA — all other routes serve the Vue entry point.
    location / {
        try_files $uri /build/index.html;
    }

    # PHP-FPM — only index.php is the entry point.
    #
    # The upstream goes through a variable for the same reason Mercure's does: a
    # literal `phpfpm:9000` is resolved once at startup and cached forever, so a
    # deploy that recreates the phpfpm container onto a different IP leaves nginx
    # dialling a dead address and 502s the entire site until someone restarts it
    # by hand. That happens on any backend-only release — the nginx image is
    # unchanged, so compose leaves this container running while phpfpm is
    # replaced. Nothing logs at startup and it doesn't self-heal.
    location ~ ^/index\.php(/|$) {
        set $fpm_upstream phpfpm:9000;
        fastcgi_pass $fpm_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        include fastcgi_params;
        internal;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
