name: bookshare

services:

  # ── PHP-FPM ────────────────────────────────────────────────────────────────
  phpfpm:
    build:
      context: .
      dockerfile: docker/local/php/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
    restart: unless-stopped
    volumes:
      - .:/var/www/app
    env_file:
      - docker/local/php/app.env          # static literals (APP_ENV, CORS, MAILER_DSN …)
    environment:
      # Secrets and compose-time substitutions — sourced from .env / .env.local
      APP_SECRET: ${APP_SECRET:-change_me_in_dot_env_local}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-changeme}@postgresql:5432/${POSTGRES_DB:-bookshare}?serverVersion=16&charset=utf8
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-}
      # PHP runtime tuning — edit in .env to tune without rebuilding
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
      PHP_UPLOAD_MAX: ${PHP_UPLOAD_MAX:-50M}
      PHP_POST_MAX: ${PHP_POST_MAX:-50M}
      PHP_MAX_EXEC: ${PHP_MAX_EXEC:-60}
    extra_hosts:
      # Allows Xdebug inside the container to reach the IDE on the host machine
      - "host.docker.internal:host-gateway"
    healthcheck:
      # cgi-fcgi is provided by the `fcgi` Alpine package installed in the Dockerfile.
      # It sends a real FastCGI ping request — more reliable than a plain TCP check.
      test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - app

  # ── Nginx ──────────────────────────────────────────────────────────────────
  # A self-signed TLS certificate is generated automatically on first start
  # via docker/local/nginx/docker-entrypoint.d/init-certs.sh.
  # Replace docker/local/nginx/certs/{cert,key}.pem with mkcert output for a
  # browser-trusted cert.
  nginx:
    build:
      context: docker/local/nginx
      dockerfile: Dockerfile
      args:
        NGINX_VERSION: ${NGINX_VERSION:-1.27}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8000}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - .:/var/www/app:ro
      # Both halves of the config are mounted, deliberately. The Dockerfile also
      # COPYs nginx.conf (so the image stands alone), but with only conf.d/ live
      # the two could drift: a restart would pair the host's new site config with
      # the image's stale main config. That's how `limit_req zone=public_api` in
      # conf.d/ once met an nginx.conf without the matching limit_req_zone, and
      # nginx refused to boot with "zero size shared memory zone".
      - ./docker/local/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/local/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/local/nginx/certs:/etc/nginx/certs   # writable so init-certs.sh can create them
    depends_on:
      phpfpm:
        condition: service_healthy              # wait for fpm to be accepting connections
    networks:
      - app

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgresql:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookshare}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-bookshare}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - app

  # ── Mercure hub (real-time SSE) ──────────────────────────────────────────────
  # Standalone Go/Caddy hub that holds the long-lived browser SSE connections, so
  # PHP-FPM never ties up a worker per client. PHP publishes to it over the
  # internal network; the browser subscribes through nginx at /.well-known/mercure.
  # SERVER_NAME=:80 keeps Caddy on plain HTTP — nginx terminates TLS.
  mercure:
    image: ${MERCURE_IMAGE:-dunglas/mercure:v0.24}
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      # HMAC secrets the hub uses to verify publisher / subscriber JWTs. Both come
      # from the single MERCURE_JWT_SECRET shared with Symfony's mercure.yaml.
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureSecret!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureSecret!}
      # anonymous off ⇒ a valid subscriber JWT (our per-user cookie) is required.
      # cors_origins lets the credentialed EventSource handshake through in dev.
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${MERCURE_CORS_ORIGINS:-https://localhost http://localhost}
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    networks:
      - app

  # ── Monitoring (optional) ──────────────────────────────────────────────────
  # Start with: docker compose --profile logs up -d
  #
  # Alloy scrapes nginx/FPM/PostgreSQL metrics and remote-writes to Prometheus.
  # Grafana connects to Prometheus as its default datasource (pre-provisioned).

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.55.1}
    profiles: [logs]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - prometheus_data:/prometheus
      - ./docker/local/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    networks:
      - monitoring

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.5.0}
    profiles: [logs]
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    environment:
      # Constructed from substitutions — must stay here, not in env_file
      POSTGRES_DSN: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-changeme}@postgresql:5432/${POSTGRES_DB:-bookshare}?sslmode=disable"
    volumes:
      - ./docker/local/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - prometheus
    networks:
      - app
      - monitoring

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.4.0}
    profiles: [logs]
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    env_file:
      - docker/local/monitoring/grafana.env  # static Grafana config
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/local/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

  # -- Messenger worker (outbound mail) --------------------------------------
  # Consumes the `async` transport, which every mail is routed to: sending is an
  # SMTP round-trip and no API response should wait on one. Same image as
  # phpfpm — it runs the same app, just from the console instead of FPM.
  #
  # --time-limit and --memory-limit make the worker restart itself periodically:
  # a long-lived PHP process accumulates memory, and `restart: unless-stopped`
  # turns a clean exit into a fresh process rather than a dead queue.
  messenger-worker:
    build:
      # Same build as phpfpm above (compose has no way to share one build block).
      context: .
      dockerfile: docker/local/php/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
    restart: unless-stopped
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M -v
    volumes:
      - .:/var/www/app
    env_file:
      - docker/local/php/app.env
    environment:
      APP_SECRET: ${APP_SECRET:-change_me_in_dot_env_local}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-changeme}@postgresql:5432/${POSTGRES_DB:-bookshare}?serverVersion=16&charset=utf8
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
      # Xdebug in a worker would stall every message the same way it stalled
      # every request (see docker/local/php/xdebug.ini).
      XDEBUG_MODE: "off"
    depends_on:
      postgresql:
        condition: service_healthy
      phpfpm:
        # Not a dependency of the worker itself — it just keeps the queue table's
        # migration (run by the phpfpm entrypoint) ahead of the first consume.
        condition: service_healthy
    networks:
      - app

  # -- Mailpit (local SMTP catcher) -------------------------------------------
  # Everything the app sends locally lands here instead of a real relay: the
  # stack has no credentials for one, and a dev database full of plausible
  # addresses is exactly what you don't want pointed at an SMTP provider.
  #   • UI + REST API:  http://localhost:${MAILPIT_UI_PORT:-8025}
  #   • SMTP:           mailpit:1025 (MAILER_DSN in docker/local/php/app.env)
  # The REST API is what the Playwright suite asserts against (tests/e2e).
  # Production has no equivalent, deliberately — see compose.prod.yaml.
  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.21}
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      # Exposed so a host-side script (or a second app instance) can send too.
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      # Accept anything: there are no credentials worth checking in a catcher.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      # Ring buffer — a long-running dev stack shouldn't grow unbounded.
      MP_MAX_MESSAGES: 500
    networks:
      - app

networks:
  app:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  postgresql_data:
  grafana_data:
  prometheus_data:
  alloy_data:
  mercure_data:
  mercure_config:
