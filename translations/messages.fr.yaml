# API messages. The key is the English sentence exactly as it appears at the
# throw/return site in src/ — see App\Api\ApiError.
'A category with this name already exists.': 'Une catégorie portant ce nom existe déjà.'
'A collection needs at least %count% of your books.': 'Une collection doit contenir au moins %count% de vos livres.'
'Access denied.': 'Accès refusé.'
'Book not found.': 'Livre introuvable.'
'Category name is required.': 'Le nom de la catégorie est obligatoire.'
'Category not found.': 'Catégorie introuvable.'
'Collection not found.': 'Collection introuvable.'
'Google authentication failed': 'Échec de la connexion avec Google'
'Invalid category filter.': 'Filtre de catégorie invalide.'
'Invalid due date.': 'Date de retour invalide.'
'Invalid language filter.': 'Filtre de langue invalide.'
'Invalid status filter.': 'Filtre de statut invalide.'
'Message is too long (max 255 characters).': 'Le message est trop long (255 caractères maximum).'
'Missing authorization code': 'Code d''autorisation manquant'
'Missing bookId.': 'bookId manquant.'
'Name cannot be empty.': 'Le nom ne peut pas être vide.'
'No file was uploaded.': 'Aucun fichier n''a été envoyé.'
'One of the selected books is no longer available to borrow.': 'L''un des livres sélectionnés n''est plus disponible à l''emprunt.'
'Select at least %count% available books to borrow a collection.': 'Sélectionnez au moins %count% livres disponibles pour emprunter une collection.'
'This book is no longer available to lend.': 'Ce livre ne peut plus être prêté.'
'This book is not available to borrow right now.': 'Ce livre n''est pas disponible à l''emprunt pour le moment.'
'This book is out on loan and can''t be edited until it''s returned.': 'Ce livre est prêté et ne pourra être modifié qu''après son retour.'
'This collection is out on loan and can''t be deleted.': 'Cette collection est prêtée et ne peut pas être supprimée.'
'This collection is out on loan and can''t be edited.': 'Cette collection est prêtée et ne peut pas être modifiée.'
'This is not your borrow request.': 'Cette demande d''emprunt n''est pas la vôtre.'
'This library is private.': 'Cette bibliothèque est privée.'
'This loan is not active.': 'Ce prêt n''est pas en cours.'
'This profile is private.': 'Ce profil est privé.'
'This reader isn''t accepting borrow requests right now.': 'Ce lecteur n''accepte pas de demandes d''emprunt pour le moment.'
'This reader keeps their library private.': 'Ce lecteur garde sa bibliothèque privée.'
'This reader''s library is private.': 'La bibliothèque de ce lecteur est privée.'
'This request has already been resolved.': 'Cette demande a déjà été traitée.'
'Unknown template source.': 'Source de modèles inconnue.'
'User not found.': 'Utilisateur introuvable.'
'You already have a pending request for this book.': 'Vous avez déjà une demande en attente pour ce livre.'
'You cannot borrow your own collection.': 'Vous ne pouvez pas emprunter votre propre collection.'
'You cannot follow yourself.': 'Vous ne pouvez pas vous suivre vous-même.'
'You cannot request your own book.': 'Vous ne pouvez pas demander votre propre livre.'
'You do not own the requested book.': 'Le livre demandé ne vous appartient pas.'
'You do not own this book.': 'Ce livre ne vous appartient pas.'
'You do not own this collection.': 'Cette collection ne vous appartient pas.'
