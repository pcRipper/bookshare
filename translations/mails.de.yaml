# Outbound mail. Its own domain rather than `messages`, because these strings
# are rendered for the *recipient* (App\Mail\Mailer resolves their stored
# locale), not for whoever's request triggered them.
#
# Same convention as messages/validators: the key is the English sentence
# exactly as it appears in src/Mail/MailType.php or templates/emails/, so
# English needs no catalog. Pinned by tests/I18n/MailTranslationCoverageTest.
'%follower% is now following you': '%follower% folgt dir jetzt'
'%follower% is now following your library.': '%follower% folgt jetzt deiner Bibliothek.'
'%owner% approved your request. Enjoy the read!': '%owner% hat deine Anfrage genehmigt. Viel Freude beim Lesen!'
'%owner% confirmed your return. Thank you for bringing it back.': '%owner% hat deine Rückgabe bestätigt. Danke fürs Zurückbringen.'
'%owner% declined your request.': '%owner% hat deine Anfrage abgelehnt.'
'%requester% has started returning this. Confirm the return once it is back with you.': '%requester% hat die Rückgabe eingeleitet. Bestätige sie, sobald du das Buch zurückhast.'
'%requester% is returning %item%': '%requester% gibt %item% zurück'
'%requester% would like to borrow %item%': '%requester% möchte %item% ausleihen'
'%requester% would like to borrow this from your library.': '%requester% möchte das aus deiner Bibliothek ausleihen.'
'A collection of %count% books': 'Sammlung mit %count% Büchern'
'A new borrow request': 'Eine neue Leihanfrage'
