# Custom Assert messages from src/Dto/*. {{ limit }} is the constraint's own
# placeholder — keep it verbatim.
'A collection is required.': 'La collection est obligatoire.'
'A collection name is required.': 'Le nom de la collection est obligatoire.'
'A colour is required.': 'La couleur est obligatoire.'
'A letter can carry at most 20 versions.': 'Une lettre peut contenir au maximum 20 versions.'
'A rating must be between 1 and 5 stars.': 'Une note doit être comprise entre 1 et 5 étoiles.'
'A review cannot be longer than 1000 characters.': 'Un avis ne peut pas dépasser 1000 caractères.'
'A route name is required.': 'Le nom de la page est obligatoire.'
'A loan can only be set through the borrow-request flow.': 'Le statut « prêté » ne peut être défini que via une demande d''emprunt.'
'A subject cannot be longer than 120 characters.': 'Un objet ne peut pas dépasser 120 caractères.'
'A subject is required.': 'Un objet est obligatoire.'
'A version can carry at most 10 lines.': 'Une version peut contenir au maximum 10 lignes.'
'A version is required.': 'Une version est obligatoire.'
'An intro cannot be longer than 300 characters.': 'Une introduction ne peut pas dépasser 300 caractères.'
'An update line cannot be blank.': 'Une ligne ne peut pas être vide.'
