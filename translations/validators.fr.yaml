'Author is required.': 'L''auteur est obligatoire.'
'Category name is required.': 'Le nom de la catégorie est obligatoire.'
'Category name is too long.': 'Le nom de la catégorie est trop long.'
'Pick at least {{ limit }} books.': 'Choisissez au moins {{ limit }} livres.'
'Select at least one update.': 'Sélectionnez au moins une nouveauté.'
'Select at least {{ limit }} books to borrow.': 'Sélectionnez au moins {{ limit }} livres à emprunter.'
'The cover must be a valid URL.': 'La couverture doit être une URL valide.'
'Title is required.': 'Le titre est obligatoire.'
'Unknown language.': 'Langue inconnue.'
'Unknown route.': 'Page inconnue.'
'Unsupported colour.': 'Couleur non prise en charge.'
'Unsupported language.': 'Langue non prise en charge.'
