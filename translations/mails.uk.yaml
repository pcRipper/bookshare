# See mails.de.yaml for the convention (English sentence as the key).
#
# 'A collection of %count% books' is phrased as a label plus a number rather
# than a counted noun: Ukrainian needs three plural forms and a numeral-noun
# agreement that changes at 2–4, and a collection is always ≥2 books, so the
# label sidesteps a plural rule nothing else here needs.
'%follower% is now following you': '%follower% тепер стежить за тобою'
'%follower% is now following your library.': '%follower% тепер стежить за твоєю бібліотекою.'
'%owner% approved your request. Enjoy the read!': '%owner% схвалив твій запит. Приємного читання!'
'%owner% confirmed your return. Thank you for bringing it back.': '%owner% підтвердив твоє повернення. Дякуємо, що повернув.'
'%owner% declined your request.': '%owner% відхилив твій запит.'
'%requester% has started returning this. Confirm the return once it is back with you.': '%requester% розпочав повернення. Підтверди його, коли отримаєш книгу назад.'
'%requester% is returning %item%': '%requester% повертає %item%'
'%requester% would like to borrow %item%': '%requester% хоче позичити %item%'
'%requester% would like to borrow this from your library.': '%requester% хоче позичити це з твоєї бібліотеки.'
'A collection of %count% books': 'Збірка, книг: %count%'
'A new borrow request': 'Новий запит на позику'
