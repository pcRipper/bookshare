# Custom Assert messages from src/Dto/*. {{ limit }} is the constraint's own
# placeholder — keep it verbatim.
'A collection is required.': 'Вкажіть збірку.'
'A collection name is required.': 'Вкажіть назву збірки.'
'A colour is required.': 'Виберіть колір.'
'A letter can carry at most 20 versions.': 'Лист може містити щонайбільше 20 версій.'
'A rating must be between 1 and 5 stars.': 'Оцінка має бути від 1 до 5 зірок.'
'A review cannot be longer than 1000 characters.': 'Відгук не може бути довшим за 1000 символів.'
'A route name is required.': 'Потрібна назва сторінки.'
'A loan can only be set through the borrow-request flow.': 'Статус «позичено» встановлюється лише через запит на позику.'
'A subject cannot be longer than 120 characters.': 'Тема не може бути довшою за 120 символів.'
'A subject is required.': 'Потрібна тема листа.'
'A version can carry at most 10 lines.': 'Версія може містити щонайбільше 10 рядків.'
'A version is required.': 'Потрібна версія.'
'An intro cannot be longer than 300 characters.': 'Вступ не може бути довшим за 300 символів.'
'An update line cannot be blank.': 'Рядок не може бути порожнім.'
'An update line cannot be longer than 200 characters.': 'Рядок не може бути довшим за 200 символів.'
'Author is required.': 'Вкажіть автора.'
'Category name is required.': 'Вкажіть назву категорії.'
'Category name is too long.': 'Назва категорії задовга.'
'Pick at least {{ limit }} books.': 'Виберіть щонайменше {{ limit }} книг.'
'Select at least one update.': 'Виберіть щонайменше одну новину.'
'Select at least {{ limit }} books to borrow.': 'Виберіть щонайменше {{ limit }} книг для позики.'
'The cover must be a valid URL.': 'Обкладинка має бути коректним URL.'
'Title is required.': 'Вкажіть назву.'
'Unknown language.': 'Невідома мова.'
'Unknown route.': 'Невідома сторінка.'
'Unsupported colour.': 'Колір не підтримується.'
'Unsupported language.': 'Мова не підтримується.'
