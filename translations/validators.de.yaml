# Custom Assert messages from src/Dto/*. Symfony's own constraint messages
# (NotBlank, Length, Url…) ship translated with the validator component.
# {{ limit }} is the constraint's own placeholder — keep it verbatim.
'A collection is required.': 'Eine Sammlung ist erforderlich.'
'A collection name is required.': 'Ein Sammlungsname ist erforderlich.'
'A colour is required.': 'Eine Farbe ist erforderlich.'
'A letter can carry at most 20 versions.': 'Ein Brief kann höchstens 20 Versionen enthalten.'
'A rating must be between 1 and 5 stars.': 'Eine Bewertung muss zwischen 1 und 5 Sternen liegen.'
'A review cannot be longer than 1000 characters.': 'Eine Rezension darf höchstens 1000 Zeichen lang sein.'
'A route name is required.': 'Ein Seitenname ist erforderlich.'
'A loan can only be set through the borrow-request flow.': 'Der Status „verliehen“ kann nur über eine Leihanfrage gesetzt werden.'
'A subject cannot be longer than 120 characters.': 'Ein Betreff darf höchstens 120 Zeichen lang sein.'
'A subject is required.': 'Ein Betreff ist erforderlich.'
'A version can carry at most 10 lines.': 'Eine Version kann höchstens 10 Zeilen enthalten.'
'A version is required.': 'Eine Version ist erforderlich.'
'An intro cannot be longer than 300 characters.': 'Eine Einleitung darf höchstens 300 Zeichen lang sein.'
'An update line cannot be blank.': 'Eine Zeile darf nicht leer sein.'
'An update line cannot be longer than 200 characters.': 'Eine Zeile darf höchstens 200 Zeichen lang sein.'
'Author is required.': 'Ein Autor ist erforderlich.'
'Category name is required.': 'Ein Kategoriename ist erforderlich.'
'Category name is too long.': 'Der Kategoriename ist zu lang.'
'Pick at least {{ limit }} books.': 'Wähle mindestens {{ limit }} Bücher aus.'
'Select at least one update.': 'Wähle mindestens eine Neuerung aus.'
'Select at least {{ limit }} books to borrow.': 'Wähle mindestens {{ limit }} Bücher zum Ausleihen aus.'
'The cover must be a valid URL.': 'Das Cover muss eine gültige URL sein.'
'Title is required.': 'Ein Titel ist erforderlich.'
'Unknown language.': 'Unbekannte Sprache.'
'Unknown route.': 'Unbekannte Seite.'
'Unsupported colour.': 'Nicht unterstützte Farbe.'
'Unsupported language.': 'Nicht unterstützte Sprache.'
