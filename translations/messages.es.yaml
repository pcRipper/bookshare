# API messages. The key is the English sentence exactly as it appears at the
# throw/return site in src/ — see App\Api\ApiError.
'A category with this name already exists.': 'Ya existe una categoría con este nombre.'
'A collection needs at least %count% of your books.': 'Una colección necesita al menos %count% de tus libros.'
'API rate limit exceeded. Please slow down and try again later.': 'Se ha superado el límite de peticiones de la API. Ve más despacio e inténtalo de nuevo más tarde.'
'Access denied.': 'Acceso denegado.'
'Administrator access is required.': 'Se requiere acceso de administrador.'
'Book not found.': 'Libro no encontrado.'
'Category name is required.': 'El nombre de la categoría es obligatorio.'
'Category not found.': 'Categoría no encontrada.'
'Collection not found.': 'Colección no encontrada.'
'Duplicate of an existing book — skipped.': 'Duplicado de un libro existente: omitido.'
'Google authentication failed': 'Error al iniciar sesión con Google'
'Invalid category filter.': 'Filtro de categoría no válido.'
'Invalid due date.': 'Fecha de devolución no válida.'
'Invalid language filter.': 'Filtro de idioma no válido.'
'Invalid status filter.': 'Filtro de estado no válido.'
'Invalid wish-list priority filter.': 'Filtro de prioridad de lista de deseos no válido.'
'Message is too long (max 255 characters).': 'El mensaje es demasiado largo (máx. 255 caracteres).'
'Missing authorization code': 'Falta el código de autorización'
'Missing bookId.': 'Falta bookId.'
'Missing required column "%column%".': 'Falta la columna obligatoria "%column%".'
'Name cannot be empty.': 'El nombre no puede estar vacío.'
'No file was uploaded.': 'No se ha subido ningún archivo.'
'One of the selected books is no longer available to borrow.': 'Uno de los libros seleccionados ya no está disponible para préstamo.'
'Select at least %count% available books to borrow a collection.': 'Selecciona al menos %count% libros disponibles para pedir prestada una colección.'
'The file is empty.': 'El archivo está vacío.'
'This book is no longer available to lend.': 'Este libro ya no se puede prestar.'
'This book is not available to borrow right now.': 'Este libro no está disponible para préstamo en este momento.'
'This book is on its owner''s wish list, not their shelf.': 'Este libro está en la lista de deseos de su propietario, no en su estantería.'
'This book is out on loan and can''t be edited until it''s returned.': 'Este libro está prestado y no se puede editar hasta que se devuelva.'
'This collection is out on loan and can''t be deleted.': 'Esta colección está prestada y no se puede eliminar.'
'This collection is out on loan and can''t be edited.': 'Esta colección está prestada y no se puede editar.'
'This is not your borrow request.': 'Esta no es tu solicitud de préstamo.'
'This library is not shared.': 'Esta biblioteca no se comparte.'
'This library is private.': 'Esta biblioteca es privada.'
'This loan is not active.': 'Este préstamo no está activo.'
'This profile is private.': 'Este perfil es privado.'
'This reader isn''t accepting borrow requests right now.': 'Este lector no acepta solicitudes de préstamo en este momento.'
'This reader keeps their library private.': 'Este lector mantiene su biblioteca privada.'
'This reader''s library is private.': 'La biblioteca de este lector es privada.'
'This request can no longer be withdrawn — it has already been answered.': 'Esta solicitud ya no se puede retirar: ya ha sido respondida.'
'This request has already been resolved.': 'Esta solicitud ya se ha resuelto.'
'Too many rows — the limit is %limit%.': 'Demasiadas filas: el límite es %limit%.'
'Unknown template source.': 'Fuente de plantillas desconocida.'
'Unsupported status "%status%".': 'Estado no admitido "%status%".'
'Unsupported wish-list priority "%priority%".': 'Prioridad de lista de deseos no admitida "%priority%".'
'User not found.': 'Usuario no encontrado.'
'You already have a pending request for this book.': 'Ya tienes una solicitud pendiente para este libro.'
'You cannot borrow your own collection.': 'No puedes pedir prestada tu propia colección.'
'You cannot follow yourself.': 'No puedes seguirte a ti mismo.'
'You cannot request your own book.': 'No puedes solicitar tu propio libro.'
'You do not own the requested book.': 'El libro solicitado no es tuyo.'
'You do not own this book.': 'Este libro no es tuyo.'
'You do not own this collection.': 'Esta colección no es tuya.'
