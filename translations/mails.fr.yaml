# See mails.de.yaml for the convention (English sentence as the key).
# Typographic apostrophes (’) are used deliberately: a straight quote would have
# to be doubled inside these single-quoted YAML values.
'%follower% is now following you': '%follower% te suit maintenant'
'%follower% is now following your library.': '%follower% suit maintenant ta bibliothèque.'
'%owner% approved your request. Enjoy the read!': '%owner% a approuvé ta demande. Bonne lecture !'
'%owner% confirmed your return. Thank you for bringing it back.': '%owner% a confirmé ton retour. Merci de l’avoir rapporté.'
'%owner% declined your request.': '%owner% a refusé ta demande.'
'%requester% has started returning this. Confirm the return once it is back with you.': '%requester% a lancé le retour. Confirme-le dès que tu l’as récupéré.'
