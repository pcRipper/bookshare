# Rate limiting for the JSON API. Three limiters, keyed differently, are applied
# by App\EventSubscriber\RateLimitSubscriber:
#
#   auth_ip      → keyed by client IP, guards the unauthenticated /api/auth
#                  endpoints against credential/code brute-forcing.
#   api_user     → keyed by the authenticated user, enforces per-account fair use
#                  across every other /api call.
#   api_ip_user  → keyed by IP + user, a tighter combined bucket that also reins
#                  in a single client behind one address.
#   public_ip    → keyed by client IP, guards the unauthenticated /api/public
#                  share pages. Deliberately far tighter than api_user: there is
#                  no account to hold responsible, and the id space is
#                  sequential, so this is the endpoint a scraper walks.
#   pageview_ip_user → keyed by IP + user, guards the traffic beacon. Tighter
#                  than api_user (300/min) because a valid token could otherwise
#                  burn 300 increments a minute into the counters, and nobody
#                  navigates a SPA six times a second.
#   admin_dump   → keyed by the authenticated operator, guards POST
#                  /api/admin/dumps. Orders of magnitude tighter than anything
#                  else here because a dump is the single most expensive thing an
#                  authenticated request can ask for: it forks pg_dump or walks
#                  every table, and each one lands on disk. Five an hour is more
#                  than any human workflow needs and far less than it takes to
#                  fill a droplet.
#
# Storage uses the cache pool (cache.rate_limiter); swap to a Redis/Lock-backed
# pool for multi-node deployments so counters are shared.
framework:
    rate_limiter:
        auth_ip:
            policy: 'sliding_window'
            limit: 20
            interval: '15 minutes'
        api_user:
            policy: 'sliding_window'
            limit: 300
            interval: '1 minute'
        api_ip_user:
            policy: 'token_bucket'
            limit: 120          # burst capacity
            rate:
                interval: '1 second'
                amount: 5       # sustained refill: 5 req/s
        public_ip:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'
        pageview_ip_user:
            policy: 'token_bucket'
            limit: 30           # burst: a fast tab-flicking session
            rate:
                interval: '10 seconds'
                amount: 1       # sustained 6/min
        admin_dump:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'

when@test:
    # Keep tests deterministic: very high ceilings so the limiter never trips
    # incidentally. The subscriber's own behaviour is unit-tested in isolation.
    framework:
        rate_limiter:
            auth_ip:
                limit: 100000
            api_user:
                limit: 100000
            api_ip_user:
                limit: 100000
                rate:
                    amount: 100000
            public_ip:
                limit: 100000
            pageview_ip_user:
                limit: 100000
                rate:
                    amount: 100000
            admin_dump:
                limit: 100000
