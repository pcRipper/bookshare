# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Scoped HTTP clients for the external book-template sources. The User-Agent
    # identifies us (Open Library grants a higher 3 req/s rate limit). Timeouts
    # keep a slow upstream from stalling the template search, but a *single*
    # transient hiccup must not blank the results: `retry_failed` re-issues a
    # failed call (transport errors + 5xx) a couple of times before the provider
    # degrades to an empty list. Without this, one timed-out first request
    # returned HTTP 200 `{items:[],hasMore:false}` — indistinguishable from "no
    # matches" — and only a manual re-search recovered it.
    http_client:
        scoped_clients:
            openlibrary.client:
                base_uri: 'https://openlibrary.org'
                # No User-Agent here on purpose: Open Library answers a blank one
                # with 403, and `default:` can't cover a set-but-empty env var.
                # ExternalBookTemplateProvider sends it per request with a fallback.
                timeout: 5
                max_duration: 12
                retry_failed:
                    max_retries: 2
                    delay: 200
            # Scoped client for bookfinder.com.ua (the "Ukrainian stores" source).
            # The timeouts here are much longer than Open Library's, for a measured
            # reason: this API computes a query server-side before sending anything,
            # taking ~7s to first byte on a query it hasn't seen (then ~0.08s once
            # its own cache is warm). Symfony's `timeout` is the *inactivity*
            # timeout, which covers that wait — so at 5s every cold query was
            # aborted client-side, and the source only worked because retry_failed
            # eventually re-issued it against an upstream the aborted attempts had
            # meanwhile warmed. Measured, three cold queries per arm: at 5s ALL
            # three attempts (initial + 2 retries) aborted before one succeeded —
            # 13-26s wall, mean 17.7s, three upstream requests each. At 12s the
            # first attempt succeeds — 7.3-9.3s, mean 8.0s, zero retries, one
            # request. The one remaining retry still covers a genuine blip, and the
            # providers' failure cooldown keeps a hanging upstream from tying up the
            # FPM workers. (The retry storm is visible as `Try #N` lines on
            # monolog's http_client channel — that's how this was measured.)
            bookfinder.client:
                base_uri: 'https://www.bookfinder.com.ua'
                headers:
                    User-Agent: '%env(BOOKFINDER_USER_AGENT)%'
                timeout: 12
                max_duration: 25
                retry_failed:
                    max_retries: 1
                    delay: 200

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
