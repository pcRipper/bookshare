monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        # Book-template searches against the external sources (Open Library,
        # bookfinder.com.ua). Its own channel because these records are an
        # operational feed — one per search, carrying cache hit/miss, upstream
        # status and duration — read to answer "why did that search come back
        # empty / slow", not to hunt application errors.
        - book_template
        # Outbound mail. One record per send (or per deliberate skip: an opt-out,
        # a user with no address). Its own channel for the same reason
        # book_template has one — a mail that never went out raises no error, so
        # this feed is the only way to tell "nobody was notified" from "nobody
        # needed to be".
        - mail
        # The admin SQL sandbox. One record per attempt — run, previewed,
        # committed, rejected or failed — alongside the sql_sandbox_entry row,
        # so the trail survives even a database restore.
        - sql_sandbox

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                # book_template gets its own file below — excluded here so a
                # search feed doesn't drown the application log.
                channels: ["!event", "!book_template", "!mail", "!sql_sandbox"]
            book_template:
                type: stream
                path: "%kernel.logs_dir%/book_template.log"
                level: info
                channels: [book_template]
            mail:
                type: stream
                path: "%kernel.logs_dir%/mail.log"
                level: debug
                channels: [mail]
            sql_sandbox:
                type: stream
                path: "%kernel.logs_dir%/sql_sandbox.log"
                level: debug
                channels: [sql_sandbox]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                # book_template must NOT sit behind the fingers_crossed gate: a
                # successful-but-slow search logs at info and raises no error, so
                # the gate would hold — and then discard — exactly the records we
                # added the channel for. It streams unconditionally below.
                channels: ["!deprecation", "!book_template", "!mail", "!sql_sandbox"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            book_template:
                type: stream
                channels: [book_template]
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
            # Same reasoning as book_template: outside the fingers_crossed gate,
            # since a skipped or queued mail logs at info and never trips it.
            mail:
                type: stream
                channels: [mail]
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
            # Same again: a statement an operator ran is logged at info and must
            # never wait on — or be discarded by — the fingers_crossed gate.
            sql_sandbox:
                type: stream
                channels: [sql_sandbox]
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
