monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        # Book-template searches against the external sources (Open Library,
        # bookfinder.com.ua). Its own channel because these records are an
        # operational feed — one per search, carrying cache hit/miss, upstream
        # status and duration — read to answer "why did that search come back
        # empty / slow", not to hunt application errors.
        - book_template

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                # book_template gets its own file below — excluded here so a
                # search feed doesn't drown the application log.
                channels: ["!event", "!book_template"]
            book_template:
                type: stream
                path: "%kernel.logs_dir%/book_template.log"
                level: info
                channels: [book_template]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                # book_template must NOT sit behind the fingers_crossed gate: a
                # successful-but-slow search logs at info and raises no error, so
                # the gate would hold — and then discard — exactly the records we
                # added the channel for. It streams unconditionally below.
                channels: ["!deprecation", "!book_template"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            book_template:
                type: stream
                channels: [book_template]
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
