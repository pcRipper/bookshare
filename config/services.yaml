# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Tag every book-template strategy so BookTemplateSearch can collect them.
    _instanceof:
        App\Service\BookTemplate\BookTemplateProvider:
            tags: ['app.book_template_provider']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Where localized images (avatars, covers) are persisted. Local disk today;
    # repoint this alias at a DO Spaces / S3 implementation to swap the backend
    # without touching ImageLocalizer.
    App\Service\Storage\ImageStorage: '@App\Service\Storage\LocalImageStorage'

    App\Service\GoogleAuthService:
        arguments:
            $clientId: '%env(GOOGLE_CLIENT_ID)%'
            $clientSecret: '%env(GOOGLE_CLIENT_SECRET)%'
            $redirectUri: '%env(GOOGLE_REDIRECT_URI)%'

    # Inject the scoped Open Library client (see framework.yaml http_client) and
    # its dedicated cache pool + hit TTL (see cache.yaml, .env). The logger is the
    # dedicated `book_template` channel (monolog.yaml): one record per search, kept
    # out of the application log and, in prod, out of the fingers_crossed gate.
    App\Service\BookTemplate\ExternalBookTemplateProvider:
        arguments:
            $client: '@openlibrary.client'
            $cache: '@cache.openlibrary'
            $cacheTtl: '%env(int:OPENLIBRARY_CACHE_TTL)%'
            $logger: '@monolog.logger.book_template'
            # Passed to the provider (not set as a client header) so a blank value
            # falls back to a built-in UA — Open Library 403s a blank one.
            $userAgent: '%env(OPENLIBRARY_USER_AGENT)%'

    # Same wiring for the bookfinder.com.ua source (the "Ukrainian stores" strategy).
    App\Service\BookTemplate\BookFinderBookTemplateProvider:
        arguments:
            $client: '@bookfinder.client'
            $cache: '@cache.bookfinder'
            $cacheTtl: '%env(int:BOOKFINDER_CACHE_TTL)%'
            $logger: '@monolog.logger.book_template'
